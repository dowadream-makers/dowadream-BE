spring:
  application:
    name: dowadream-be
  config:
    # 로컬 개발: 프로젝트 폴더의 .env 파일(커밋 안 됨)을 읽어 환경변수처럼 씁니다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dowadream}
    username: ${DATABASE_USERNAME:dowadream}
    password: ${DATABASE_PASSWORD:dowadream}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 표는 Flyway(db/migration)가 만듭니다.

app:
  public-data:
    # 공공데이터포털 Decoding 인증키. 비어 있으면 공공데이터 동기화를 건너뜁니다.
    key: ${PUBLIC_DATA_KEY:}
    # 매일 04:00(서울)에 노원구 병원 동기화. 배포 직후 한 번 돌리려면 SYNC_ON_STARTUP=true
    sync-cron: "0 0 4 * * *"
    sync-on-startup: ${SYNC_ON_STARTUP:false}
    region:
      sido-name: 서울특별시
      sggu-name: 노원구
      # 노원구청 좌표. 이 근처 병원 응답에서 노원구 지역 코드(sidoCd, sggu-cd)를 읽습니다.
      x: 127.0565
      y: 37.6543
  zone: Asia/Seoul
  auth:
    # 회원 토큰 서명용 비밀값(32바이트 이상). 비어 있으면 켤 때마다 임시 값 (서버를 다시 켜면 다시 로그인)
    jwt-secret: ${AUTH_JWT_SECRET:}
    # 소셜 로그인 콜백 주소를 만들 때 쓰는 이 서버의 공개 주소 (Render 주소)
    backend-url: ${BACKEND_URL:http://localhost:8080}
    # 로그인 끝나고 돌아갈 프론트 주소 (Vercel 주소)
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # 소셜 로그인 키. client-id가 비어 있는 회사는 버튼이 숨겨집니다. (docs/social-login.md)
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}         # 카카오 REST API 키
      client-secret: ${KAKAO_CLIENT_SECRET:} # 카카오 보안 Client Secret을 켰을 때만
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
